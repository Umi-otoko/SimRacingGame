; Enhanced Input Actions — se mapean en los Input Mapping Contexts via Blueprint/C++
; Estos bindings son los defaults del teclado/gamepad; se sobrescriben con volante.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; IA_ = Input Action
; Los archivos .uasset de Input Actions se crean en Content/Input/
; Aqui se definen los fallback legacy por compatibilidad

+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=1.0,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=S)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Down)
+AxisMappings=(AxisName="Brake",Scale=1.0,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steering",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Steering",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Steering",Scale=1.0,Key=Gamepad_LeftX)

+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="GearUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=E)
+ActionMappings=(ActionName="GearUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="GearDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Q)
+ActionMappings=(ActionName="GearDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="LookBack",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=C)
+ActionMappings=(ActionName="SwitchCamera",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=V)
+ActionMappings=(ActionName="ResetVehicle",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=R)
+ActionMappings=(ActionName="OpenSetup",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=F5)
