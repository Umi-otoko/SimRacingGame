[URL]
GameName=SimRacingGame

; ============================================================
; Online Subsystem — Steam
; ============================================================

[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=True
SteamDevAppId=480
bInitServerOnClient=True
GameServerQueryPort=27015
bRelaunchInSteam=False

[/Script/OnlineSubsystemSteam.SteamNetDriver]
NetConnectionClassName="OnlineSubsystemSteam.SteamNetConnection"

; ============================================================
; Network — Servidor autoritativo, 100Hz física
; ============================================================

[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=64000
MaxDynamicBandwidth=8000
MinDynamicBandwidth=4000
MAXPOSITIONERRORSQUARED=4.0
MAXCLIENTUPDATEINTERVAL=0.25
MaxClientSmoothingDeltaTime=0.50
ClientAuthorativePosition=False

[/Script/Engine.Engine]
NetClientTicksPerSecond=60
bUseFixedFrameRate=False

; ============================================================
; Física — Substepping a 100 Hz para el vehículo
; ============================================================

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
DefaultTerminalVelocity=4000.0
bSubstepping=True
MaxSubstepCount=8
MaxPhysicsSubstepDeltaTime=0.010000
bEnableEnhancedDeterminism=True
bEnablePCM=True
SolverType=Chaos

; ============================================================
; Renderer — Configuración para 144+ FPS sim-racing
; ============================================================

[/Script/Engine.RendererSettings]
r.DefaultFeature.MotionBlur=True
r.MotionBlurQuality=2
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.AutoExposure.Bias=0
r.Shadow.CSM.MaxCascades=3
r.HZBOcclusion=1
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=True
r.Lumen.ReflectionMethod=1
r.Lumen.GlobalIllumination=1
r.Nanite=1
r.DynamicGlobalIlluminationMethod=1

; ============================================================
; Input — Enhanced Input System
; ============================================================

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMotionControls=False

; ============================================================
; Consola — Comandos útiles para dev
; ============================================================

[ConsoleVariables]
r.SetRes=2560x1440f
p.Vehicle.EnableChaosVehicles=1
p.Chaos.Solver.Iterations=8
net.MaxPacketSize=1400

; ============================================================
; Mapa por defecto — TestTrack generado por SetupRacingGame.py
; ============================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/SimRacing/Maps/TestTrack.TestTrack
GameDefaultMap=/Game/SimRacing/Maps/TestTrack.TestTrack

; ============================================================
; Python Script Plugin — auto-ejecuta SetupRacingGame.py
; ============================================================

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
+StartupScripts=(FilePath="Scripts/SetupRacingGame.py")

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=BE2BAE5942F84BFD018189ABC18BA016
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

